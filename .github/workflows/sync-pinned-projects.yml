name: Sync pinned GitHub projects

on:
  workflow_dispatch:
  schedule:
    # Every six hours (UTC).
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  sync-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch pinned repositories
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
          GITHUB_PROFILE_USERNAME: srijan-76448
        run: node scripts/sync-pinned-projects.mjs
      - name: Commit changed feed
        run: |
          if git diff --quiet -- assets/github-projects.json; then
            echo "Pinned-project feed has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-projects.json
          git commit -m "chore: sync pinned GitHub projects"
          git push
